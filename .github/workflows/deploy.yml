name: Deploy All Web Interface Projects

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create deployment folder
        run: |
          mkdir -p _site

      - name: Copy HTML projects
        run: |
          for folder in */; do
            if [ "$folder" = ".git/" ] || [ "$folder" = ".github/" ]; then
              continue
            fi

            if find "$folder" -name "package.json" -type f | grep -q .; then
              continue
            fi

            echo "Copying HTML project: $folder"
            cp -r "$folder" "_site/$folder"
          done

      - name: Copy main index.html
        run: |
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          fi

      - name: Build all React projects
        shell: bash
        run: |
          set -e

          find . -name package.json \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './_site/*' \
            -print0 |
          while IFS= read -r -d '' package; do

            project_dir=$(dirname "$package")
            relative_dir=${project_dir#./}

            echo ""
            echo "======================================"
            echo "Building: $relative_dir"
            echo "======================================"

            cd "$GITHUB_WORKSPACE/$project_dir"

            npm install

            npm run build -- --base="/Web-Interface/$relative_dir/"

            mkdir -p "$GITHUB_WORKSPACE/_site/$relative_dir"

            cp -r dist/. "$GITHUB_WORKSPACE/_site/$relative_dir/"

          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
