<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f2f2;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            width:300px;
        }

        h1{
            color:#333;
        }

        #count{
            font-size:60px;
            color:#6a5acd;
            margin:20px 0;
        }

        button{
            padding:10px 18px;
            margin:5px;
            border:none;
            border-radius:5px;
            font-size:16px;
            color:white;
            cursor:pointer;
        }

        .plus{
            background:#28a745;
        }

        .minus{
            background:#dc3545;
        }

        .reset{
            background:#6c757d;
        }

        button:hover{
            opacity:0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Counter App</h1>

    <h2 id="count">0</h2>

    <button class="plus" onclick="increase()">+1</button>
    <button class="minus" onclick="decrease()">-1</button>
    <button class="reset" onclick="reset()">Reset</button>

</div>

<script>
    let count = 0;

    function increase() {
        count++;
        document.getElementById("count").innerHTML = count;
    }

    function decrease() {
        if (count > 0) {
            count--;
            document.getElementById("count").innerHTML = count;
        } else {
            alert("Counter cannot be less than 0");
        }
    }

    function reset() {
        count = 0;
        document.getElementById("count").innerHTML = count;
    }
</script>

</body>
</html>
